name: Feature request
description: Suggest a focused improvement or workflow.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Employee workspace
        - Administrator workspace
        - AI model integration
        - Canvas editing
        - Localization
        - Deployment and operations
        - Documentation
    validations:
      required: true
