name: Bug report
description: Report a reproducible product or installation problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove secrets, API keys, private prompts, and customer assets before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start...
        2. Open...
        3. Click...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-preview.22
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node.js 24, Chrome 140
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Redact credentials, local paths, account names, and private content.
